<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>サンプルユーザーのプロフィール - connpass (mock)</title>
  </head>
  <body>
    <div class="profile_header_area mb_20">
      <div class="title">
        <div class="avatar mb_20 text_center">
          <img
            src="https://media.connpass.com/thumbs/sample.png"
            width="60"
            height="60"
            title="サンプル 太郎"
            alt="サンプル 太郎"
          />
        </div>
        <h2 class="title_2">サンプル 太郎</h2>
      </div>
      <div class="space-between">
        <span class="username">(sample_taro)</span>
      </div>
      <div class="space-between">
        <span class="social_link">
          <a
            href="https://x.com/intent/user?user_id=1"
            target="_blank"
            title="X(Twitter)を見る"
            >X</a
          >
          <a
            href="https://github.com/sample_taro"
            target="_blank"
            title="GitHubを見る"
            >GitHub</a
          >
        </span>
        <span class="profile_date">利用開始日: 2020/01/01</span>
      </div>
      <p>サンプル用の自己紹介文です。</p>
    </div>

    <div class="event_area mb_10 event_closure_list">
      <div class="event_list vevent">
        <div class="event_detail_area">
          <div class="event_inner">
            <p class="event_title">
              <a
                class="url summary"
                href="https://smarthr.connpass.com/event/385269/"
                >サンプルイベント</a
              >
            </p>
            <p class="event_owner">
              <span class="icon_owner"
                ><a href="/user/other/">別の主催者</a></span
              >
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
