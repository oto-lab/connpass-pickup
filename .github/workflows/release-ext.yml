name: release-ext

on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン: semverのバンプ種別(patch/minor/major/prerelease)、または明示バージョン(例: 1.2.0)"
        required: true
        default: patch
      dist_tag:
        description: '公開区分(GitHub Releaseの命名・pre-release判定に使用)。空欄なら自動判定(例: "1.2.0-beta.0"なら"beta"、通常バージョンなら"latest")'
        required: false
        default: ""
      target:
        description: "ビルド対象: all/chrome/firefox"
        required: false
        default: "all"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install
      - run: pnpm run ci
      - run: pnpm --filter connpass-pickup-ext run typecheck
      - run: pnpm --filter connpass-pickup-ext run test

      - name: Bump ext/ version
        id: bump
        working-directory: ext
        run: |
          OLD="$(node -p "require('./package.json').version")"
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version >/dev/null
          NEW="$(node -p "require('./package.json').version")"
          echo "version=ext-v${NEW}" >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::バージョンは既に ${NEW} のため、更新コミットはスキップしてリリースだけ行います。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$NEW" == *-* ]]; then
            REST="${NEW#*-}"
            PRERELEASE_ID="${REST%%.*}"
          else
            PRERELEASE_ID=""
          fi

          TAG="${{ inputs.dist_tag }}"
          if [ -z "$TAG" ]; then
            if [ -n "$PRERELEASE_ID" ]; then TAG="$PRERELEASE_ID"; else TAG="latest"; fi
          fi
          echo "prerelease=$([ "$TAG" = "latest" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = "latest" ]; then
            echo "release_title=ext-v${NEW}" >> "$GITHUB_OUTPUT"
          else
            echo "release_title=ext-v${NEW} ($TAG)" >> "$GITHUB_OUTPUT"
          fi

          for f in src/manifest.chrome.json src/manifest.firefox.json; do
            node -e "
              const fs = require('node:fs');
              const manifest = JSON.parse(fs.readFileSync('$f', 'utf-8'));
              manifest.version = '${NEW}';
              fs.writeFileSync('$f', JSON.stringify(manifest, null, 2) + '\n');
            "
          done
          cd ..
          pnpm exec prettier --write ext/src/manifest.chrome.json ext/src/manifest.firefox.json

      - name: Build
        run: |
          TARGET="${{ inputs.target || 'all' }}"
          pnpm --filter connpass-pickup-ext exec tsdown
          pnpm --filter connpass-pickup-ext exec node scripts/build.mjs --zip --target="$TARGET"

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.bump.outputs.changed }}" = "true" ]; then
            git commit -am "release(ext): ${{ steps.bump.outputs.version }}"
          fi
          if ! git rev-parse -q --verify "refs/tags/${{ steps.bump.outputs.version }}" >/dev/null; then
            git tag "${{ steps.bump.outputs.version }}"
          fi
          git push origin HEAD "${{ steps.bump.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=()
          VERSION="$(node -p "require('./ext/package.json').version")"
          [ -f ext/dist/chrome.zip ] && ASSETS+=("ext/dist/chrome.zip#connpass-pickup-ext-chrome-${VERSION}.zip")
          [ -f ext/dist/firefox.xpi ] && ASSETS+=("ext/dist/firefox.xpi#connpass-pickup-ext-firefox-${VERSION}.xpi")

          gh release create "${{ steps.bump.outputs.version }}" \
            --title "${{ steps.bump.outputs.release_title }}" \
            --generate-notes \
            "${ASSETS[@]}" \
            ${{ steps.bump.outputs.prerelease == 'true' && '--prerelease' || '' }}
