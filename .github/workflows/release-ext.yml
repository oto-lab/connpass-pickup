name: release-ext

on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン(例: 1.2.3)。空欄なら ext/package.json の現在のバージョンをそのまま使う(バンプしない)"
        required: false
        default: ""
      force_release:
        description: "最新タグと同じ/古いバージョンでも強制的にリリースする"
        required: false
        default: "false"
      target:
        description: "ビルド対象: all/chrome/firefox"
        required: false
        default: "all"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install
      - run: pnpm run ci
      - run: pnpm --filter connpass-pickup-ext run typecheck
      - run: pnpm --filter connpass-pickup-ext run test

      - name: バージョンを指定された場合のみ適用する
        if: inputs.version != ''
        working-directory: ext
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          for f in src/manifest.chrome.json src/manifest.firefox.json; do
            node -e "
              const fs = require('node:fs');
              const manifest = JSON.parse(fs.readFileSync('$f', 'utf-8'));
              manifest.version = '$VERSION';
              fs.writeFileSync('$f', JSON.stringify(manifest, null, 2) + '\n');
            "
          done

      - name: Read package info
        id: pkg
        working-directory: ext
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          TARGET="${{ inputs.target || 'all' }}"
          pnpm --filter connpass-pickup-ext exec tsdown
          pnpm --filter connpass-pickup-ext exec node scripts/build.mjs --zip --target="$TARGET"

      - name: Get latest ext tag
        id: tag
        run: |
          git fetch --tags
          LATEST_TAG="$(git tag --list 'ext-v*' --sort=-v:refname | head -n1 || true)"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          LATEST="${LATEST_TAG#ext-v}"
          echo "latest_version=${LATEST:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: compare
        run: |
          if [ "${{ inputs.force_release }}" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST="${{ steps.tag.outputs.latest_version }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          if [ -z "${{ steps.tag.outputs.latest_tag }}" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$LATEST" = "$VERSION" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HIGHEST="$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n1)"
          if [ "$HIGHEST" = "$VERSION" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ext/package.jsonのバージョン($VERSION)が最新タグ($LATEST)以下のため、リリースをスキップします(force_release: trueで強制可能)。"
          fi

      - name: Commit and push version bump
        if: steps.compare.outputs.should_release == 'true' && inputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- ext/package.json ext/src/manifest.chrome.json ext/src/manifest.firefox.json; then
            git commit -am "release(ext): ext-v${{ steps.pkg.outputs.version }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Create tag
        if: steps.compare.outputs.should_release == 'true'
        run: |
          TAG="ext-v${{ steps.pkg.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        if: steps.compare.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ext-v${{ steps.pkg.outputs.version }}"
          ASSETS=()
          [ -f ext/dist/chrome.zip ] && ASSETS+=("ext/dist/chrome.zip#connpass-pickup-ext-chrome-${{ steps.pkg.outputs.version }}.zip")
          [ -f ext/dist/firefox.xpi ] && ASSETS+=("ext/dist/firefox.xpi#connpass-pickup-ext-firefox-${{ steps.pkg.outputs.version }}.xpi")

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes "拡張機能(Chrome/Firefox)のビルド成果物を添付しています。ストアへの提出は別途手動で行ってください。" \
            "${ASSETS[@]}"
